<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Victor Ekwueme — Accessibility Consultant{% endblock %}</title>
    <meta name="description" content="Victor Ekwueme offers web accessibility audits, training, and public speaking on digital inclusion.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<body>
    <a class="visually-hidden-focusable" href="#main-content">Skip to main content</a>
    <header>
      <nav class="navbar navbar-expand-md navbar-light bg-light" aria-label="Main">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('home') }}">Victor Ekwueme</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" 
            aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('services') }}">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('contact') }}">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>
    </header>

    <main id="main-content">
        <div class="container py-5">
        {% block content %}{% endblock %}
        </div>
    </main>

 
<footer class="site-footer">
    <div class="container">
        <p>&copy; 2026 Victor Ekwueme. All rights reserved.</p>
        <div class="social-links">
            <a href="https://www.linkedin.com/in/ogovekwueme" aria-label="Victor Ekwueme on LinkedIn">LinkedIn</a>
            <a href="https://www.instagram.com/ogovictor" aria-label="Victor Ekwueme on Instagram">Instagram</a>
            <a href="https://www.youtube.com/@victorsdigitalvision" aria-label="Victor Ekwueme on YouTube">YouTube</a>
            <a href="https://twitter.com/ogoekwueme" aria-label="Victor Ekwueme on Twitter">Twitter</a>
            <a href="https://www.tiktok.com/@ogovekwueme" aria-label="Victor Ekwueme on TikTok">TikTok</a>
        </div>
    </div>
</footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
